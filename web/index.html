<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>Astelier</title>
		<script>
			// 首帧前定下 data-skin / data-theme（显式选择 > 系统偏好），
			// 令牌值由主题模块在求值期写入。
			;(function () {
				function read(key) {
					try { return localStorage.getItem(key) } catch { return null }
				}
				var t = read('astelier-mode')
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
				}
				document.documentElement.dataset.theme = t
				var s = read('astelier-skin')
				if (s === 'aurora' || s === 'mono') document.documentElement.dataset.skin = s
			})()
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
