[package]
name = "atelier"
version = "0.1.0"
edition = "2021"
publish = false

# rust server + react(tldraw) 前端（web/，bun 管理）。
# 服务端只做：REST API（/api/*）、资产（/asset/*）、托管 web/dist。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
opt-level = 1
